# alembic.ini — Alembic migration tool configuration.
#
# Configuration:
#   - script_location points to alembic/ directory in project root.
#   - sqlalchemy.url is NOT set here — loaded dynamically in env.py
#     from DATABASE_URL environment variable.
#
# Usage:
#   alembic upgrade head     — Apply all pending migrations
#   alembic downgrade -1     — Revert last migration
#   alembic revision --autogenerate -m "add column"  — Generate migration
#   alembic history          — Show migration history
#   alembic current          — Show current revision

[alembic]
# Path to alembic/ directory (relative to project root)
script_location = alembic

# Migration file naming: timestamp_description.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database URL loaded dynamically in env.py — do NOT set here.
# sqlalchemy.url = (loaded from env)

# Encoding for migration files
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
