# ════════════════════════════════════════════════════════════════
# GitHub Action: Keep-Alive Ping for Hugging Face Spaces
# ════════════════════════════════════════════════════════════════
# Pings the HF Space every 10 minutes to prevent sleep.
# No secrets needed — just the public URL of your Space.

name: Keep HF Space Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          SPACE_URL="https://medmml-amazon-bot-pin.hf.space"

          echo "Pinging: $SPACE_URL/health"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "$SPACE_URL/health" || echo "000")

          echo "Response code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Space is alive!"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️ Connection failed — Space may be starting up"
          else
            echo "⚠️ Unexpected response code: $HTTP_CODE"
          fi
