# ════════════════════════════════════════════════════════════════
# GitHub Action: Keep-Alive Ping for Render (free web service)
# ════════════════════════════════════════════════════════════════
# Pings the Render app every 10 minutes to prevent free-tier sleep
# (Render free spins down after 15 min without inbound traffic).
# Secret needed: RENDER_APP_URL (e.g. https://amazon-affiliate-bot.onrender.com)

name: Keep Render App Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          APP_URL="${{ secrets.RENDER_APP_URL }}"

          echo "Pinging: $APP_URL/health"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "$APP_URL/health" || echo "000")

          echo "Response code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ App is alive!"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️ Connection failed — app may be sleeping/starting"
          else
            echo "⚠️ Unexpected response code: $HTTP_CODE"
          fi